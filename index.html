<!doctype html>
<html lang="pt-BR">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="theme-color" content="#0d1117" />
  <meta name="color-scheme" content="dark" />
  <!--
    Page-specific tags (title, description, canonical, og:*, twitter:*, JSON-LD)
    are rendered by each page via react-helmet-async and injected at build time
    by scripts/prerender.mjs at the "app-head" placeholder comment below.
    Keep only site-wide tags here.
  -->
  <meta name="author" content="Rafael Martin Alves Ferreira" />
  <meta name="keywords"
    content="Azure, DevOps, Cloud, FinOps, Terraform, Bicep, Platform Engineering, Observability, Mentoria, Kubernetes, Microsoft MVP, Cloud Architecture, AKS, GitOps, GitHub Actions, Azure DevOps, Prometheus, Grafana, IaC, Rafael Ferreira" />
  <meta name="robots" content="index, follow, max-image-preview:large, max-snippet:-1, max-video-preview:-1" />
  <meta property="og:site_name" content="Rafael Ferreira" />
  <meta property="og:locale:alternate" content="en_US" />
  <meta name="twitter:site" content="@orafaelferreira" />
  <meta name="twitter:creator" content="@orafaelferreira" />

  <link rel="icon" href="/favicon.ico" sizes="any" />
  <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
  <link rel="manifest" href="/site.webmanifest" />
  <link rel="sitemap" type="application/xml" href="/sitemap.xml" />
  <link rel="alternate" type="application/rss+xml" title="Rafael Ferreira Blog RSS" href="/rss.xml" />
  <!-- llms.txt / llms-full.txt: content index and full text for AI/LLM crawlers -->
  <link rel="alternate" type="text/plain" title="llms.txt" href="/llms.txt" />
  <link rel="alternate" type="text/plain" title="llms-full.txt" href="/llms-full.txt" />

  <!-- DNS prefetch for external resources -->
  <link rel="dns-prefetch" href="https://stoblobcertificados011.blob.core.windows.net" />
  <link rel="dns-prefetch" href="https://www.googletagmanager.com" />
  <link rel="preconnect" href="https://stoblobcertificados011.blob.core.windows.net" crossorigin />

  <!-- Google tag (gtag.js) - Hard-coded per request -->
  <script async src="https://www.googletagmanager.com/gtag/js?id=G-0RVS46EEQ5"></script>
  <script>
    window.dataLayer = window.dataLayer || [];
    function gtag() { window.dataLayer.push(arguments); }
    gtag('js', new Date());
    // SPA will control and emit page_view events; disable auto page view to avoid duplicates
    gtag('config', 'G-0RVS46EEQ5', { send_page_view: false });
  </script>
  <!--app-head-->
</head>

<body>
  <div id="root"><!--app-html--></div>
  <script type="module" src="/src/main.tsx"></script>
</body>

</html>
