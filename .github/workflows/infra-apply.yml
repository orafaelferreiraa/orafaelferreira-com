name: infra-apply

on:
  push:
    branches: [ main ]
    paths:
      - 'infra/**'
      - '.github/workflows/infra-apply.yml'
  workflow_dispatch:


permissions:
  contents: write

concurrency:
  group: infra-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

jobs:
  core-validation:
    name: Pipeline Core Validation
    uses: orafaelferreiraa/pipeline-as-a-service-stack/.github/workflows/pipeline-core.yaml@main
    secrets: inherit
    permissions:
      contents: read
      pull-requests: write
      security-events: write
    with:
      terraform_dir: infra
      terraform_version: '1.13.4'
      enable_tflint: true
      enable_tfsec: true
      enable_checkov: true
      generate_tfdocs: true
      soft_fail: true

  terraform:
    name: Terraform Apply
    needs: core-validation
    runs-on: ubuntu-latest
    timeout-minutes: 30
    if: github.actor != 'github-actions[bot]'
    env:
      ARM_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
      ARM_CLIENT_SECRET: ${{ secrets.AZURE_CLIENT_SECRET }}
      ARM_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
      ARM_SUBSCRIPTION_ID: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
    defaults:
      run:
        shell: bash
        working-directory: infra
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.13.4

      - name: Cache Terraform providers
        uses: actions/cache@v4
        with:
          path: |
            infra/.terraform
            ~/.terraform.d/plugin-cache
          key: ${{ runner.os }}-terraform-${{ hashFiles('infra/.terraform.lock.hcl') }}
          restore-keys: |
            ${{ runner.os }}-terraform-

      - name: Generate terraform docs (inject no README – sem commit)
        uses: terraform-docs/gh-actions@v1.3.0
        with:
          working-dir: infra
          output-file: ../README.md
          output-method: inject
          git-push: false

      - name: Commit terraform-docs changes (main)
        if: github.event_name == 'push'
        run: |
          set -e
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add ../README.md || true
          if ! git diff --cached --quiet; then
            git commit -m 'chore(docs): update Terraform module docs in root README'
            git push
          else
            echo "No terraform-docs changes to commit."
          fi

      - name: Terraform Init
        run: terraform init -input=false

      - name: Terraform Apply
        env:
          SWA_REPOSITORY_TOKEN: ${{ secrets.GH_PAT_SWA }}
        run: |
          terraform apply -auto-approve -input=false \
            -var "repository_url=https://github.com/${{ github.repository }}" \
            -var "repository_branch=${{ github.ref_name }}" \
            -var "repository_token=${SWA_REPOSITORY_TOKEN}"

      - name: Job summary
        if: always()
        run: |
          {
            echo "## Terraform Apply Summary";
            echo "";
            echo "| Item | Value |";
            echo "|------|-------|";
            echo "| Branch | \`${{ github.ref_name }}\` |";
            echo "| Actor | \`${{ github.actor }}\` |";
            echo "| Backend | \`stostateorafael/statetf/infra.terraform.tfstate\` |";
            echo "| Status | ✅ Applied |";
          } >> "$GITHUB_STEP_SUMMARY"
