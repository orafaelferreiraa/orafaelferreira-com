name: sync-talks-on-event-day

# Workflow agendado APENAS nos dias dos próximos eventos (upcomingTalks).
# As entradas de cron entre os marcadores AUTO-CRON:START/END são geradas
# automaticamente por scripts/generate-event-schedule.mjs (acionado pelo
# workflow regenerate-event-schedule.yml sempre que Talks.tsx muda OU
# quando este workflow conclui movendo um evento).

on:
  # AUTO-CRON:START
  schedule:
    - cron: '5 11 22 8 *'  # 2026-08-22
  # AUTO-CRON:END
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: sync-talks-on-event-day
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      # IMPORTANTE: o push precisa usar WORKFLOW_PAT, nao o GITHUB_TOKEN.
      # Pushes feitos com GITHUB_TOKEN NAO disparam outros workflows (protecao
      # anti-recursao do GitHub), o que fazia o commit entrar no main sem que o
      # deploy-app rodasse -> a palestra nunca aparecia no site.
      - name: Validate WORKFLOW_PAT
        env:
          WORKFLOW_PAT: ${{ secrets.WORKFLOW_PAT }}
        run: |
          if [[ -z "${WORKFLOW_PAT}" ]]; then
            echo "::error::Secret WORKFLOW_PAT ausente. Sem ele o push nao dispara o deploy-app e a palestra nao aparece no site."
            exit 1
          fi
          echo "✅ WORKFLOW_PAT presente."

      - name: Checkout
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.WORKFLOW_PAT }}
          fetch-depth: 0
          ref: main

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Run sync script
        env:
          TZ: America/Sao_Paulo
          # Grava dentro do workspace para que hashFiles() consiga enxergar o
          # arquivo (hashFiles so avalia caminhos sob GITHUB_WORKSPACE).
          SYNC_OUTPUT_FILE: ${{ github.workspace }}/moved-talks.json
        run: node scripts/sync-talks-and-events.mjs

      - name: Notify Power Automate (1 POST per moved talk)
        if: ${{ hashFiles('moved-talks.json') != '' }}
        env:
          MOVED_FILE: ${{ github.workspace }}/moved-talks.json
          WEBHOOK_URL: ${{ secrets.POWER_AUTOMATE_WEBHOOK_URL }}
        run: |
          set -euo pipefail
          if [[ -z "${WEBHOOK_URL}" ]]; then
            echo "⚠️ Secret POWER_AUTOMATE_WEBHOOK_URL não configurado. Pulando notificação."
            exit 0
          fi
          count=$(jq 'length' "$MOVED_FILE")
          echo "📤 Disparando $count notificação(ões) para Power Automate..."
          for i in $(seq 0 $((count - 1))); do
            payload=$(jq -c ".[$i] | {event, date, todo: (\"update CV + blog post \" + .event)}" "$MOVED_FILE")
            event_name=$(echo "$payload" | jq -r '.event')
            todo_title=$(echo "$payload" | jq -r '.todo')
            echo "  → POST: $todo_title"
            http_code=$(curl -sS -o /tmp/pa-resp.txt -w '%{http_code}' \
              -X POST "$WEBHOOK_URL" \
              -H 'Content-Type: application/json' \
              --data "$payload" || echo "000")
            if [[ "$http_code" =~ ^2 ]]; then
              echo "    ✅ HTTP $http_code"
            else
              echo "    ❌ HTTP $http_code"
              cat /tmp/pa-resp.txt || true
              exit 1
            fi
          done

      - name: Commit and push if changed
        run: |
          if [[ -n "$(git status --porcelain)" ]]; then
            echo "Mudanças detectadas. Commitando..."
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add -A
            git commit -m "chore(talks): sync automático no dia do evento"
            git push
            echo "✅ Push realizado. deploy-app + regenerate-event-schedule serão acionados."
          else
            echo "Nenhuma mudança hoje. Nada a fazer."
          fi
