name: infra-plan

on:
  push:
    branches:
      - '**'
    paths:
      - 'infra/**'
      - '.github/workflows/infra-plan.yml'
  pull_request:
    branches: [ main ]
    paths:
      - 'infra/**'
      - '.github/workflows/infra-plan.yml'
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: write

concurrency:
  group: infra-plan-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

jobs:
  core-validation:
    name: Pipeline Core Validationn
    uses: orafaelferreiraa/pipeline-as-a-service-stack/.github/workflows/pipeline-core.yaml@main
    secrets: inherit
    permissions:
      contents: read
      pull-requests: write
      security-events: write
    with:
      terraform_dir: infra
      terraform_version: '~1.14.0'
      enable_tflint: true
      enable_trivy: true
      enable_checkov: true
      generate_tfdocs: false
      soft_fail: true

  terraform-plan:
    name: Terraform Plan
    needs: core-validation
    runs-on: ubuntu-latest
    timeout-minutes: 25
    if: github.actor != 'github-actions[bot]'
    env:
      ARM_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
      ARM_CLIENT_SECRET: ${{ secrets.AZURE_CLIENT_SECRET }}
      ARM_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
      ARM_SUBSCRIPTION_ID: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
      TF_VAR_site_subscription_id: ${{ secrets.SITE_SUBSCRIPTION_ID }}
      TF_VAR_dns_subscription_id: ${{ secrets.DNS_SUBSCRIPTION_ID }}
      TF_VAR_apex_domain_validation_token: ${{ secrets.APEX_DOMAIN_VALIDATION_TOKEN }}
    defaults:
      run:
        shell: bash
        working-directory: infra
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
            terraform_version: '~1.14.0'

      - name: Terraform Init
        id: init
        run: terraform init -input=false

      - name: Terraform Plan
        id: plan
        run: |
          terraform plan -input=false -out=tfplan \
            -var "repository_url=https://github.com/${{ github.repository }}" \
            -var "repository_branch=${{ github.head_ref || github.ref_name }}" \
            -var "repository_token=placeholder"

      - name: Upload plan artifact
        uses: actions/upload-artifact@v4
        with:
          name: terraform-plan
          path: infra/tfplan
          if-no-files-found: error
          retention-days: 7

      - name: Show plan (for PR comment)
        id: showplan
        run: |
          terraform show -no-color tfplan > plan.txt || true
          echo "PLAN<<EOF" >> $GITHUB_OUTPUT
          sed 's/[^[:print:][:space:]]//g' plan.txt >> $GITHUB_OUTPUT || true
          echo "EOF" >> $GITHUB_OUTPUT

      - name: Terraform Plan Summary Comment
        if: github.event_name == 'pull_request'
        uses: actions/github-script@v7
        env:
          PLAN: ${{ steps.showplan.outputs.PLAN }}
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const planTextRaw = process.env.PLAN || '(sem saída)';
            const planText = planTextRaw.replace(/```/g, '\n```\n');
            
            const body = [
              '## Terraform Plan Results',
              '',
              '```terraform',
              planText,
              '```',
              '',
              `*Pusher: @${{ github.actor }} | Action: \`${{ github.event_name }}\`*`
            ].join('\n');
            
            await github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body
            });

      - name: Terraform Plan Status
        if: steps.plan.outcome == 'failure'
        run: exit 1

      - name: Summary
        if: always()
        run: |
          {
            echo "## Terraform Plan Summary";
            echo "";
            echo "| Item | Value |";
            echo "|------|-------|";
            echo "| Branch | \`${{ github.head_ref || github.ref_name }}\` |";
            echo "| Actor | \`${{ github.actor }}\` |";
            echo "| Event | \`${{ github.event_name }}\` |";
            echo "";
            echo "✅ Plan artifact armazenado para análise";
          } >> "$GITHUB_STEP_SUMMARY"
