name: deploy-app

on:
  push:
    branches: [ main ]
    paths:
      - 'src/**'
      - 'e2e/**'
      - 'public/**'
      - 'index.html'
      - 'package.json'
      - 'package-lock.json'
      - 'bun.lockb'
      - 'tsconfig*.json'
      - 'vite.config.ts'
      - 'tailwind.config.ts'
      - 'postcss.config.js'
      - 'eslint.config.js'
      - 'tsconfig.node.json'
      - '.github/workflows/deploy-app.yml'  
  workflow_dispatch:

  workflow_run:
    workflows: ["infra-apply"]
    types:
      - completed
    branches: [ main ]

permissions:
  contents: read

concurrency:
  group: deploy-app-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

jobs:
  build_and_deploy:
    if: |
      (github.event_name == 'push' && github.actor != 'github-actions[bot]') ||
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'workflow_run' && github.event.workflow_run.conclusion == 'success')
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install deps
        run: npm install

      # Stage 1: fast unit tests (test pyramid base)
      - name: Unit tests
        run: npm run test:ci

      # Stage 2: component tests (React Testing Library)
      - name: Component tests
        run: npm run test:components:ci

      - name: Type check
        run: npm run typecheck

      - name: Build app
        run: npm run build

      # Stage 3: end-to-end smoke (Playwright)
      - name: Get Playwright version
        id: playwright-version
        run: echo "version=$(npm list @playwright/test --depth=0 --json 2>/dev/null | jq -r '.dependencies["@playwright/test"].version // empty')" >> $GITHUB_OUTPUT

      - name: Cache Playwright browsers
        uses: actions/cache@v4
        id: playwright-cache
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ steps.playwright-version.outputs.version }}
          restore-keys: |
            playwright-${{ runner.os }}-

      - name: Install Playwright browsers
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        run: npx playwright install --with-deps

      - name: Install Playwright system dependencies
        if: steps.playwright-cache.outputs.cache-hit == 'true'
        run: npx playwright install-deps

      - name: E2E smoke tests
        run: npm run test:e2e:ci

      - name: Deploy to Azure Static Web Apps
        uses: Azure/static-web-apps-deploy@v1
        with:
          azure_static_web_apps_api_token: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN }}
          action: 'upload'
          app_location: 'dist'
          skip_app_build: true

      - name: Job summary
        if: always()
        run: |
          {
            echo "## 🚀 App Deploy Summary";
            echo "";
            echo "| Item | Value |";
            echo "|------|-------|";
            echo "| Event | \`${{ github.event_name }}\` |";
            echo "| Branch | \`${{ github.ref_name }}\` |";
            echo "| Actor | \`${{ github.actor }}\` |";
            echo "| Commit | \`$(git rev-parse --short HEAD)\` |";
            echo "";
            echo "### 📦 Build Info";
            echo "";
            echo "| Metric | Value |";
            echo "|--------|-------|";
            echo "| Output | \`dist/\` |";
            echo "| Files | $(find dist -type f 2>/dev/null | wc -l || echo 'n/a') |";
            echo "| Size | $(du -sh dist 2>/dev/null | cut -f1 || echo 'n/a') |";
            echo "";
            echo "### ✅ Deploy Status";
            echo "";
            echo "Application deployed to **Azure Static Web Apps**";
            echo "";
            echo "🌐 [View Application](https://www.orafaelferreira.com)";
          } >> "$GITHUB_STEP_SUMMARY"