name: deploy-app

on:
  push:
    branches: [ main ]
    paths:
      - 'src/**'
      - 'scripts/**'
      - 'e2e/**'
      - 'public/**'
      - 'index.html'
      - 'package.json'
      - 'package-lock.json'
      - 'tsconfig*.json'
      - 'vite.config.ts'
      - 'tailwind.config.ts'
      - 'postcss.config.js'
      - 'eslint.config.js'
      - 'playwright.config.ts'
      - '.github/workflows/deploy-app.yml'
  workflow_dispatch:

  workflow_run:
    workflows: ["infra-apply"]
    types:
      - completed
    branches: [ main ]

permissions:
  contents: read

concurrency:
  group: deploy-app-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

jobs:
  build_and_deploy:
    if: |
      (github.event_name == 'push' && github.actor != 'github-actions[bot]') ||
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'workflow_run' && github.event.workflow_run.conclusion == 'success')
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # Full history so scripts/generate-sitemap.mjs can derive <lastmod> from git.
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      # Reproducible install from package-lock.json (fails if the lockfile is out of date).
      - name: Install deps
        run: npm ci

      - name: Lint
        run: npm run lint

      # pt-BR <-> en dictionaries are hand-maintained; fail fast on missing keys.
      - name: i18n parity
        run: npm run i18n:check

      # Stage 1: unit + component tests (Vitest, jsdom)
      - name: Unit and component tests
        run: npm run test:ci

      - name: Type check
        run: npm run typecheck

      # sync:talks -> rss -> sitemap -> llms -> vite build -> prerender (SSG)
      - name: Build app
        run: npm run build

      # Stage 2: end-to-end (Playwright against the built dist/, via vite preview)
      - name: Get Playwright version
        id: playwright-version
        run: echo "version=$(node -p "require('@playwright/test/package.json').version")" >> "$GITHUB_OUTPUT"

      - name: Cache Playwright browsers
        uses: actions/cache@v4
        id: playwright-cache
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ steps.playwright-version.outputs.version }}
          restore-keys: |
            playwright-${{ runner.os }}-

      - name: Install Playwright browsers
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        run: npx playwright install --with-deps chromium

      - name: Install Playwright system dependencies
        if: steps.playwright-cache.outputs.cache-hit == 'true'
        run: npx playwright install-deps chromium

      - name: E2E tests (smoke, i18n, SEO)
        run: npm run test:e2e:ci

      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7

      - name: Deploy to Azure Static Web Apps
        uses: Azure/static-web-apps-deploy@v1
        with:
          azure_static_web_apps_api_token: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN }}
          action: 'upload'
          app_location: 'dist'
          skip_app_build: true

      - name: Job summary
        if: always()
        run: |
          {
            echo "## 🚀 App Deploy Summary";
            echo "";
            echo "| Item | Value |";
            echo "|------|-------|";
            echo "| Event | \`${{ github.event_name }}\` |";
            echo "| Branch | \`${{ github.ref_name }}\` |";
            echo "| Actor | \`${{ github.actor }}\` |";
            echo "| Commit | \`$(git rev-parse --short HEAD)\` |";
            echo "";
            echo "### 📦 Build Info";
            echo "";
            echo "| Metric | Value |";
            echo "|--------|-------|";
            echo "| Output | \`dist/\` |";
            echo "| Files | $(find dist -type f 2>/dev/null | wc -l || echo 'n/a') |";
            echo "| Prerendered pages | $(find dist -name index.html 2>/dev/null | wc -l || echo 'n/a') |";
            echo "| Size | $(du -sh dist 2>/dev/null | cut -f1 || echo 'n/a') |";
            echo "";
            echo "### ✅ Deploy Status";
            echo "";
            echo "Application deployed to **Azure Static Web Apps**";
            echo "";
            echo "🌐 [View Application](https://www.orafaelferreira.com)";
          } >> "$GITHUB_STEP_SUMMARY"
